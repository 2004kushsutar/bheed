<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Automated Traffic Signal Simulator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body
    class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-screen p-4"
  >
    <div class="w-full max-w-4xl">
      <header class="text-center mb-8">
        <h1 class="text-3xl md:text-4xl font-bold text-blue-400">
          Automated Traffic Signal Simulator
        </h1>
        <p class="text-gray-400 mt-2">Traffic volume controls duration.</p>
      </header>

      <div
        class="relative w-full aspect-square max-w-lg mx-auto bg-gray-800 rounded-xl overflow-hidden shadow-2xl border-4 border-gray-700"
      >
        <div
          class="absolute inset-0 grid grid-cols-3 grid-rows-3 h-full w-full"
        >
          <div class="bg-gray-800 border-r border-b border-gray-600/30"></div>

          <div
            class="relative bg-gray-600 border-x-2 border-dashed border-gray-400/30"
          >
            <div class="absolute top-2 w-full flex justify-center">
              <span id="north-road-count" class="road-label">0 🚗</span>
            </div>
          </div>

          <div class="bg-gray-800 border-l border-b border-gray-600/30"></div>

          <div
            class="relative bg-gray-600 border-y-2 border-dashed border-gray-400/30"
          >
            <div class="absolute left-2 h-full flex items-center">
              <span id="west-road-count" class="road-label">0 🚗</span>
            </div>
          </div>

          <div
            class="relative bg-gray-600 flex items-center justify-center z-10"
          >
            <div
              class="absolute inset-2 border-2 border-dashed border-gray-500/50 rounded"
            ></div>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="48"
              height="48"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="text-gray-400 opacity-50 z-20"
            >
              <rect x="2" y="2" width="20" height="20" rx="2" />
              <path d="M2 12h20" />
              <path d="M12 2v20" />
            </svg>
          </div>

          <div
            class="relative bg-gray-600 border-y-2 border-dashed border-gray-400/30"
          >
            <div class="absolute right-2 h-full flex items-center">
              <span id="east-road-count" class="road-label">0 🚗</span>
            </div>
          </div>

          <div class="bg-gray-800 border-r border-t border-gray-600/30"></div>

          <div
            class="relative bg-gray-600 border-x-2 border-dashed border-gray-400/30"
          >
            <div class="absolute bottom-2 w-full flex justify-center">
              <span id="south-road-count" class="road-label">0 🚗</span>
            </div>
          </div>

          <div class="bg-gray-800 border-l border-t border-gray-600/30"></div>
        </div>

        <div
          class="absolute inset-0 grid grid-cols-3 grid-rows-3 pointer-events-none z-30"
        >
          <div
            class="col-start-2 row-start-1 flex items-end justify-center pb-1 space-x-2"
          >
            <div
              id="north-timer"
              class="timer text-xl font-bold"
              style="display: none"
            ></div>
            <div
              id="north-light"
              class="traffic-light-post horizontal flex space-x-1.5 scale-75 origin-bottom"
            >
              <div class="light red"></div>
              <div class="light yellow"></div>
              <div class="light green"></div>
            </div>
          </div>

          <div
            class="col-start-1 row-start-2 flex flex-col items-end justify-center pr-1 space-y-1"
          >
            <div
              id="west-timer"
              class="timer text-xl font-bold"
              style="display: none"
            ></div>
            <div
              id="west-light"
              class="traffic-light-post flex flex-col space-y-1.5 scale-75 origin-right"
            >
              <div class="light red"></div>
              <div class="light yellow"></div>
              <div class="light green"></div>
            </div>
          </div>

          <div></div>

          <div
            class="col-start-3 row-start-2 flex flex-col items-start justify-center pl-1 space-y-1"
          >
            <div
              id="east-timer"
              class="timer text-xl font-bold"
              style="display: none"
            ></div>
            <div
              id="east-light"
              class="traffic-light-post flex flex-col space-y-1.5 scale-75 origin-left"
            >
              <div class="light red"></div>
              <div class="light yellow"></div>
              <div class="light green"></div>
            </div>
          </div>

          <div
            class="col-start-2 row-start-3 flex items-start justify-center pt-1 space-x-2"
          >
            <div
              id="south-timer"
              class="timer text-xl font-bold"
              style="display: none"
            ></div>
            <div
              id="south-light"
              class="traffic-light-post horizontal flex space-x-1.5 scale-75 origin-top"
            >
              <div class="light red"></div>
              <div class="light yellow"></div>
              <div class="light green"></div>
            </div>
          </div>
        </div>
      </div>

      <div
        class="mt-8 w-full max-w-2xl mx-auto bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700"
      >
        <h2 class="text-xl font-semibold mb-4 text-center text-blue-300">
          Traffic Volume Controls
        </h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-1">
            <label
              for="north-slider"
              class="flex justify-between text-sm font-medium text-gray-300"
            >
              <span>North Traffic</span
              ><span id="north-value" class="font-bold text-blue-400">50</span>
            </label>
            <input
              id="north-slider"
              type="range"
              min="0"
              max="100"
              value="50"
              class="w-full"
            />
          </div>

          <div class="space-y-1">
            <label
              for="south-slider"
              class="flex justify-between text-sm font-medium text-gray-300"
            >
              <span>South Traffic</span
              ><span id="south-value" class="font-bold text-blue-400">50</span>
            </label>
            <input
              id="south-slider"
              type="range"
              min="0"
              max="100"
              value="50"
              class="w-full"
            />
          </div>

          <div class="space-y-1">
            <label
              for="east-slider"
              class="flex justify-between text-sm font-medium text-gray-300"
            >
              <span>East Traffic</span
              ><span id="east-value" class="font-bold text-blue-400">50</span>
            </label>
            <input
              id="east-slider"
              type="range"
              min="0"
              max="100"
              value="50"
              class="w-full"
            />
          </div>

          <div class="space-y-1">
            <label
              for="west-slider"
              class="flex justify-between text-sm font-medium text-gray-300"
            >
              <span>West Traffic</span
              ><span id="west-value" class="font-bold text-blue-400">50</span>
            </label>
            <input
              id="west-slider"
              type="range"
              min="0"
              max="100"
              value="50"
              class="w-full"
            />
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
